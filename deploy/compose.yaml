name: starbeacon
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: starbeacon_owner
      POSTGRES_PASSWORD: ${SB_DEV_DB_OWNER_PASSWORD:?请设置迁移账号密码}
      POSTGRES_DB: starbeacon
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starbeacon_owner -d starbeacon"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SB_DEV_REDIS_PASSWORD:?请设置 Redis 密码}"]
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["redis:/data"]
  nats:
    image: nats:2.15.0-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      SB_DEV_NATS_TOKEN: ${SB_DEV_NATS_TOKEN:?请设置 NATS Token}
    ports: ["127.0.0.1:24222:4222", "127.0.0.1:28222:8222"]
    volumes: ["./nats/development.conf:/etc/nats/nats.conf:ro", "nats:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:29200:9200"]
    volumes: ["elasticsearch:/usr/share/elasticsearch/data"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres:
  redis:
  nats:
  elasticsearch:
