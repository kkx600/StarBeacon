table inet starbeacon_gateway {
    set tcp4 {
        type ipv4_addr . inet_service . ipv4_addr . inet_service
        flags timeout
        size 4096
    }
    set udp4 {
        type ipv4_addr . inet_service . ipv4_addr . inet_service
        flags timeout
        size 4096
    }
    set tcp6 {
        type ipv6_addr . inet_service . ipv6_addr . inet_service
        flags timeout
        size 4096
    }
    set udp6 {
        type ipv6_addr . inet_service . ipv6_addr . inet_service
        flags timeout
        size 4096
    }
    chain forwarding {
        type filter hook forward priority -5; policy accept;
        ip saddr . tcp sport . ip daddr . tcp dport @tcp4 counter drop
        ip daddr . tcp dport . ip saddr . tcp sport @tcp4 counter drop
        ip saddr . udp sport . ip daddr . udp dport @udp4 counter drop
        ip daddr . udp dport . ip saddr . udp sport @udp4 counter drop
        ip6 saddr . tcp sport . ip6 daddr . tcp dport @tcp6 counter drop
        ip6 daddr . tcp dport . ip6 saddr . tcp sport @tcp6 counter drop
        ip6 saddr . udp sport . ip6 daddr . udp dport @udp6 counter drop
        ip6 daddr . udp dport . ip6 saddr . udp sport @udp6 counter drop
    }
}
