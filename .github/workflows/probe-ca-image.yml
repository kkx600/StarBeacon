name: 探针 CA 镜像分发
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starbeacon-probe-ca-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 拉取并导出固定摘要镜像
        run: python3 scripts/probe_ca_image.py export --directory .local/acceptance/probe-ca-image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starbeacon-probe-ca-image-linux-amd64
          path: .local/acceptance/probe-ca-image
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
