name: 版本发布
# 推送 v* 标签即发布：同一运行内完成工程检查、Linux 打包与结构核验，再创建 GitHub Release。
# 带后缀的标签（如 v0.2.0-rc.1）发布为 Prerelease，不占用 Latest。失败后在运行页面使用 Re-run failed jobs 重试。
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: 核对版本标签
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 标签格式、指向提交与 main 分支历史
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/check_release.py identity --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  checks:
    name: 工程检查
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  package:
    name: 构建 Linux 发行包
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.6.0'
          run_install: false
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: 构建 Linux amd64 ZIP 并核验 UPX 程序
        run: |
          mkdir -p .local/release
          git cat-file commit "$RELEASE_COMMIT" > .local/release/source.commit
          docker build --platform linux/amd64 -f deploy/Dockerfile.release -t starbeacon-release-builder .
          # 打包容器离线、只读、无特权运行；/tmp 需要可执行，以便回读 UPX 压缩后程序的实际版本。
          docker run --rm --platform linux/amd64 --read-only --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 6g --cpus 2 --tmpfs /tmp:rw,exec,nosuid,nodev,size=4g,mode=1777 \
            -e GOCACHE=/tmp/go-cache -e HOME=/tmp \
            --mount "type=bind,src=$PWD/web,dst=/web,readonly" \
            --mount "type=bind,src=$PWD/.local/release,dst=/output" \
            starbeacon-release-builder --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --source-commit-file /output/source.commit \
            --web-root /web --output /output --epoch "$(git show -s --format=%ct "$RELEASE_COMMIT")"
      - name: 保留构建失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starbeacon-release-diagnostics
          path: .local/release/dependency-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: 核对发行包结构并生成发行说明
        run: |
          python3 scripts/check_release.py verify --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --directory .local/release
          python3 scripts/check_release.py notes --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --directory .local/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starbeacon-release
          path: |
            .local/release/*.zip
            .local/release/checksums.json
            .local/release/notes.md
          if-no-files-found: error
          retention-days: 14
  publish:
    name: 发布 GitHub Release
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: starbeacon-release
          path: .local/release
      - name: 复核下载的发行包并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release.py publish --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY" --directory .local/release
