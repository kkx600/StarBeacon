name: 工程检查
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      - run: go mod verify
      - name: 验收门禁逻辑检查
        run: python3 -m unittest discover -s tests/quality -v
      - name: 验收环境制品验证
        run: python3 -m unittest discover -s scripts/tests -v
      - name: 功能、接口与页面契约对齐
        run: python3 scripts/check_alignment.py --check
      - run: make build test vet
      - name: 检查格式
        run: test -z "$(gofmt -l cmd internal migrations tests api/sensor)"
      - name: Linux 编译
        run: |
          for arch in amd64 arm64; do
            for name in starbeacon starbeacon-ingest starbeacon-worker starbeacon-agent starbeaconctl; do
              GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/$name-$arch" "./cmd/$name"
            done
          done
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.6.0'
          run_install: false
      - run: pnpm --dir web install --frozen-lockfile
      - name: 双端前端源码与执行证据
        run: python3 scripts/qualify_frontend.py --output .local/acceptance/frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: starbeacon-frontend-evidence
          path: .local/acceptance/frontend
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm --dir prototype install --frozen-lockfile
      - run: node --test prototype/scripts/preview-filter.test.mjs prototype/scripts/check-screenshots.test.mjs
      - run: pnpm --dir prototype check:coverage
      - run: pnpm --dir prototype check:workspaces
      - run: pnpm --dir prototype check:collector
      - run: pnpm --dir prototype check:theme
      - run: pnpm --dir prototype build
      - run: node prototype/scripts/check-screenshots.mjs
