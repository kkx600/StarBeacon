<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>星烽 StarBeacon 页面原型图</title><style>
:root{--primary:#096bff;--link:#0759d5;--workspace:#f5f7fa;--text:#22334d;--muted:#526581;--line:#e5eaf1;--control-border:#7b8fae;--info-surface:#edf3ff}*{box-sizing:border-box}body{margin:0;background:var(--workspace);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:24px 4%;position:sticky;top:0;z-index:5}h1{color:var(--link);font-size:24px;margin:0 0 8px;font-weight:600}header p{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.8}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;font-size:12px;background:#fff;border:1px solid var(--control-border);border-radius:5px;padding:8px 12px;color:var(--text)}input{min-width:240px}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}.tools>a{margin-left:auto;font-size:12px}main{padding:24px 4%}h2{font-size:17px;font-weight:600;margin:12px 0 18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:35px}.card{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0}.thumbnail{height:205px;background:#eaf0f8;overflow:hidden;border-bottom:1px solid var(--line);display:block}.thumbnail img{width:100%;height:100%;object-fit:cover;object-position:top}.image-pending{height:205px;background:#f0f4fa;display:none;place-items:center;font-size:12px;color:var(--muted)}.card h3{font-size:14px;margin:14px 15px 7px}.card p{font-size:11px;color:var(--muted);margin:0 15px 12px;line-height:1.8;height:40px;overflow:hidden}.state-links{display:flex;flex-wrap:wrap;gap:10px;padding:0 15px 12px;font-size:11px}.state-links a{border:1px solid var(--line);padding:4px 6px;border-radius:4px}.prototype-links{padding:0 15px 16px;display:flex;gap:12px;flex-wrap:wrap;font-size:10px}.requirements{font-size:10px;color:var(--muted);padding:0 15px 10px;font-family:ui-monospace,monospace}.boundaries{display:flex;flex-wrap:wrap;gap:18px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:6px}.boundary{font-size:12px;display:flex;gap:12px;align-items:center}.footer{font-size:11px;color:var(--muted);padding:0 4% 35px}.hidden{display:none!important}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.cards{grid-template-columns:1fr}.tools>a{margin-left:0}input{width:100%}header{position:static}.thumbnail{height:220px}}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}input::placeholder{color:var(--muted)}::selection{background:#dbeafe;color:#074ab8}</style></head><body><header><h1>星烽 StarBeacon 页面原型图</h1><p id="summary">全页面原型图 · 全部记录为合成示例。图片来自实际组件页面截图；点击状态查看完整图片或进入交互页面。</p><div class="tools"><input id="keyword" placeholder="搜索页面、需求编号或业务功能" aria-label="搜索原型图"><select id="group" aria-label="筛选模块"><option value="all">全部模块</option></select><select id="state" aria-label="预览状态"><option value="data">有数据</option><option value="empty">无数据</option><option value="detail">查看详情</option><option value="action">操作表单</option><option value="loading">加载中</option><option value="error">加载失败</option></select><a href="../../#/catalog">打开交互原型 →</a></div></header><main id="gallery"></main><footer class="footer">星烽 StarBeacon · 页面结构与状态用于产品评审，不代表后端能力和性能已经实现。</footer><script src="../page-manifest.js"></script><script src="./supplemental-manifest.js"></script><script>
const manifest=window.StarBeaconPageManifest;const interactiveRoot=location.protocol==='file:'?'http://127.0.0.1:4173/#':`${new URL('../',location.href).href}#`;document.querySelector('.tools>a').href=`${interactiveRoot}/catalog`;const gallery=document.querySelector('#gallery');const groupControl=document.querySelector('#group');const stateControl=document.querySelector('#state');const keyword=document.querySelector('#keyword');const cards=[];const galleryPages=[...(manifest.collector?.pages??[]),...manifest.pages];const galleryGroups=[{id:"collector",title:"采集器管理"},...manifest.groups];
document.querySelector('#summary').textContent=`${manifest.workspaces.length} 个主导航工作区 · ${manifest.pages.length} 个主平台功能视图 · ${manifest.collector?.pages.length??0} 个采集器工作区 · ${manifest.requirementCount} 项需求 · ${galleryPages.length*manifest.states.length} 个业务状态 · ${manifest.boundary.length+(manifest.collector?.boundary?.length??0)} 个边界页面。全部为合成示例，图片来自实际组件页面截图。`;
for(const group of galleryGroups){const option=document.createElement('option');option.value=group.id;option.textContent=group.title;groupControl.append(option);const section=document.createElement('section');section.dataset.group=group.id;const title=document.createElement('h2');title.textContent=group.title;section.append(title);const grid=document.createElement('div');grid.className='cards';section.append(grid);gallery.append(section);
 for(const page of galleryPages.filter(p=>p.group===group.id)){const card=document.createElement('article');card.className='card';card.dataset.search=`${page.title}${page.description}${page.requirements.join(',')}`;const thumb=document.createElement('a');thumb.className='thumbnail';thumb.href=page.states.find(item=>item.state==="data").image;thumb.target='_blank';const img=document.createElement('img');img.src=thumb.href;img.alt=`${page.title} · 有数据`;img.loading='lazy';img.onerror=()=>{img.style.display='none';pending.style.display='grid'};thumb.append(img);const pending=document.createElement('div');pending.className='image-pending';pending.textContent='截图文件待导出';thumb.append(pending);card.append(thumb);const name=document.createElement('h3');name.textContent=page.title;card.append(name);const desc=document.createElement('p');desc.textContent=page.description;card.append(desc);const requirements=document.createElement('div');requirements.className='requirements';requirements.textContent=`${manifest.workspaces.find(workspace=>workspace.pages.includes(page.id))?.title??(page.group==='collector'?'采集器管理':'个人设置')} · ${page.requirements.join(' / ')||'工作域补充视图'}`;card.append(requirements);const states=document.createElement('div');states.className='state-links';const links=document.createElement('div');links.className='prototype-links';
  for(const item of page.states){const shot=document.createElement('a');shot.textContent=item.title;shot.href=item.image;shot.target='_blank';states.append(shot);const link=document.createElement('a');link.href=`${interactiveRoot}${item.url}&capture=1`;link.textContent=`交互：${item.title}`;link.dataset.capture=`${page.id}/${item.state}`;link.dataset.title=page.title;link.dataset.state=item.state;links.append(link)}card.append(states,links);grid.append(card);cards.push({page,card,section,img,thumb,pending})
 }
}
const heading=document.createElement('h2');heading.textContent='登录与访问边界';gallery.append(heading);const boundaries=document.createElement('div');boundaries.className='boundaries';gallery.append(boundaries);for(const page of [...manifest.boundary,...(manifest.collector?.boundary??[])]){const line=document.createElement('div');line.className='boundary';const shot=document.createElement('a');shot.textContent=page.title;shot.href=`boundary/${page.id}.jpg`;shot.target='_blank';const link=document.createElement('a');link.href=`${interactiveRoot}${page.url}`;link.textContent='交互页面';link.dataset.capture=`boundary/${page.id}`;link.dataset.title=page.title;link.dataset.state='boundary';line.append(shot,link);boundaries.append(line)}
const detailHeading=document.createElement('h2');detailHeading.textContent='业务详情';gallery.append(detailHeading);const detailLinks=document.createElement('div');detailLinks.className='boundaries';for(const item of window.StarBeaconSupplemental??[]){const link=document.createElement('a');link.textContent=item.title;link.href=item.file;link.target='_blank';link.className='boundary';detailLinks.append(link)}gallery.append(detailLinks);
function update(){const state=stateControl.value;for(const item of cards){const visible=(groupControl.value==='all'||item.page.group===groupControl.value)&&item.card.dataset.search.includes(keyword.value.trim());item.card.classList.toggle('hidden',!visible);const image=item.page.states.find(value=>value.state===state).image;if(!item.img.src.endsWith(image)){item.img.style.display='block';item.pending.style.display='none';item.img.src=image;item.thumb.href=image;item.img.alt=`${item.page.title} · ${stateControl.selectedOptions[0].text}`}}for(const section of gallery.querySelectorAll('section'))section.classList.toggle('hidden',!Array.from(section.querySelectorAll('.card')).some(card=>!card.classList.contains('hidden')))}keyword.addEventListener('input',update);groupControl.addEventListener('change',update);stateControl.addEventListener('change',update);const requestedModule=new URLSearchParams(location.search).get('module');if(galleryGroups.some(group=>group.id===requestedModule)){groupControl.value=requestedModule;update()}
</script></body></html>
