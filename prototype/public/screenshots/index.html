<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>星烽 StarBeacon 页面原型图</title><style>
:root{--primary:#5d87ff;--action:#5d87ff;--link:#5d87ff;--workspace:#f7f7f7;--text:#29343d;--muted:#6b6b6b;--line:#e8e8e8;--control-border:#e4e7ed;--info-surface:#f0fdff;--selection-surface:#f0f6ff;--selection-text:#4366d9;--section-gap:12px;--panel-inset:16px}*{box-sizing:border-box}body{margin:0;background:var(--workspace);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:var(--panel-inset) 4%;position:sticky;top:0;z-index:5}h1{color:var(--link);font-size:24px;margin:0 0 8px;font-weight:600}header p{font-size:12px;color:var(--muted);margin:0 0 var(--section-gap);line-height:1.8}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;font-size:12px;background:#fff;border:1px solid var(--control-border);border-radius:8px;padding:8px 12px;color:var(--text)}input{min-width:240px}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}.tools>a{margin-left:auto;font-size:12px}main{padding:var(--panel-inset) 4%}h2{font-size:17px;font-weight:600;margin:var(--section-gap) 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--section-gap);margin-bottom:24px}.card{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0}.thumbnail{height:205px;background:#f3f3f3;overflow:hidden;border-bottom:1px solid var(--line);display:block}.thumbnail img{width:100%;height:100%;object-fit:cover;object-position:top}.image-pending{height:205px;background:#f3f3f3;display:none;place-items:center;font-size:12px;color:var(--muted)}.card h3{font-size:14px;margin:14px 15px 7px}.card p{font-size:11px;color:var(--muted);margin:0 15px 12px;line-height:1.8;height:40px;overflow:hidden}.state-links{display:flex;flex-wrap:wrap;gap:10px;padding:0 15px 12px;font-size:11px}.state-links a{border:1px solid var(--line);padding:4px 6px;border-radius:4px}.prototype-links{padding:0 15px 16px;display:flex;gap:12px;flex-wrap:wrap;font-size:10px}.requirements{font-size:10px;color:var(--muted);padding:0 15px 10px;font-family:ui-monospace,monospace}.boundaries{display:flex;flex-wrap:wrap;gap:var(--section-gap);padding:var(--panel-inset);background:#fff;border:1px solid var(--line);border-radius:6px}.boundary{font-size:12px;display:flex;gap:12px;align-items:center}.footer{font-size:11px;color:var(--muted);padding:0 4% 35px}.hidden{display:none!important}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.cards{grid-template-columns:1fr}.tools>a{margin-left:0}input{width:100%}header{position:static}.thumbnail{height:220px}}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}input::placeholder{color:var(--muted)}::selection{background:var(--selection-surface);color:var(--selection-text)}</style></head><body><header><h1>星烽 StarBeacon 页面原型图</h1><p id="summary">全页面原型图 · 全部记录为合成示例。图片来自实际组件页面截图；点击状态查看完整图片或进入交互页面。</p><p id="gallery-count">图库覆盖主控平台和采集器。图片用于界面评审，实际业务能力以工程功能与验收记录为准。</p><div class="tools"><input id="keyword" placeholder="搜索页面、需求编号或业务功能" aria-label="搜索原型图"><select id="group" aria-label="筛选模块"><option value="all">全部模块</option></select><select id="state" aria-label="预览状态"><option value="data">有数据</option><option value="empty">无数据</option><option value="detail">查看详情</option><option value="action">操作表单</option><option value="loading">加载中</option><option value="error">加载失败</option></select><a href="/catalog">打开交互原型 →</a></div></header><main id="gallery"></main><footer class="footer">星烽 StarBeacon · 页面结构与状态用于产品评审，不代表后端能力和性能已经实现。</footer><script src="../page-manifest.js"></script><script src="./supplemental-manifest.js"></script><script src="./provenance-manifest.js"></script><script>
async function startGallery(){
async function loadJSON(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error('图库数据不可用');return response.json()}
const offline=location.protocol==='file:';
const current=offline?null:await Promise.all([loadJSON('../page-manifest.json'),loadJSON('./provenance.json')]);
const provenance=current?.[1];
const supplemental=provenance?provenance.entries.filter(entry=>entry.state==='supplemental'):(window.StarBeaconSupplemental??[]);
const versions=provenance?{renderTreeSha256:provenance.renderTreeSha256,images:Object.fromEntries(provenance.entries.map(entry=>[entry.file,entry.sha256]))}:window.StarBeaconGalleryVersions;

const manifest=current?.[0]??window.StarBeaconPageManifest;const sameSource=typeof manifest.source?.renderTreeSha256==='string'&&manifest.source.renderTreeSha256===versions?.renderTreeSha256;function imageURL(file){const sha=sameSource&&versions.images[file];return sha?`${file}?v=${sha.slice(0,16)}`:''};const interactiveRoot=location.protocol==='file:'?'http://127.0.0.1:4173':new URL('../',location.href).href.replace(/\/$/,'');document.querySelector('.tools>a').href=`${interactiveRoot}/catalog`;const gallery=document.querySelector('#gallery');const groupControl=document.querySelector('#group');const stateControl=document.querySelector('#state');const keyword=document.querySelector('#keyword');const cards=[];const galleryPages=[...(manifest.collector?.pages??[]),...manifest.pages];const galleryGroups=[{id:"collector",title:"采集器管理"},...manifest.groups];
document.querySelector('#summary').textContent=`${manifest.workspaces.length} 个主导航工作区 · ${manifest.pages.length} 个主平台功能视图 · ${manifest.collector?.pages.length??0} 个采集器工作区 · ${manifest.requirementCount} 项需求 · ${galleryPages.length*manifest.states.length} 个业务状态 · ${manifest.boundary.length+(manifest.collector?.boundary?.length??0)} 个边界页面。全部为合成示例，图片来自实际组件页面截图。`;
if(!sameSource){const warning=document.createElement('p');warning.setAttribute('role','status');warning.textContent='当前页面版本尚无完整核对的截图，请查看交互原型。';gallery.append(warning)}
const baseCount=galleryPages.reduce((total,page)=>total+page.states.length,0)+manifest.boundary.length+(manifest.collector?.boundary?.length??0);document.querySelector('#gallery-count').textContent=`图库包含 ${baseCount} 张基础状态图与 ${supplemental.length} 张业务补充图，覆盖主控平台和采集器。图片用于界面评审，实际业务能力以工程功能与验收记录为准。`;
for(const group of galleryGroups){const option=document.createElement('option');option.value=group.id;option.textContent=group.title;groupControl.append(option);const section=document.createElement('section');section.dataset.group=group.id;const title=document.createElement('h2');title.textContent=group.title;section.append(title);const grid=document.createElement('div');grid.className='cards';section.append(grid);gallery.append(section);
 for(const page of galleryPages.filter(p=>p.group===group.id)){const card=document.createElement('article');card.className='card';card.dataset.search=`${page.title}${page.description}${page.requirements.join(',')}`;const thumb=document.createElement('a');thumb.className='thumbnail';thumb.href=imageURL(page.states.find(item=>item.state==="data").image);thumb.target='_blank';const img=document.createElement('img');if(sameSource)img.src=thumb.href;else img.style.display='none';img.alt=`${page.title} · 有数据`;img.loading='lazy';img.onerror=()=>{img.style.display='none';pending.style.display='grid'};thumb.append(img);const pending=document.createElement('div');pending.className='image-pending';pending.textContent='当前版本截图待核对';if(!sameSource)pending.style.display='grid';thumb.append(pending);card.append(thumb);const name=document.createElement('h3');name.textContent=page.title;card.append(name);const desc=document.createElement('p');desc.textContent=page.description;card.append(desc);const requirements=document.createElement('div');requirements.className='requirements';requirements.textContent=`${page.workspace??manifest.workspaces.find(workspace=>workspace.pages.includes(page.id))?.title??(page.group==='collector'?'采集器管理':'个人设置')} · ${page.requirements.join(' / ')||'工作域补充视图'}`;card.append(requirements);const states=document.createElement('div');states.className='state-links';const links=document.createElement('div');links.className='prototype-links';
  for(const item of page.states){const shot=document.createElement('a');shot.textContent=item.title;shot.href=imageURL(item.image);shot.target='_blank';states.append(shot);const link=document.createElement('a');link.href=`${interactiveRoot}${item.url}&capture=1`;link.textContent=`交互：${item.title}`;link.dataset.capture=`${page.id}/${item.state}`;link.dataset.title=page.title;link.dataset.state=item.state;links.append(link)}card.append(states,links);grid.append(card);cards.push({page,card,section,img,thumb,pending})
 }
}
const heading=document.createElement('h2');heading.textContent='登录与访问边界';gallery.append(heading);const boundaries=document.createElement('div');boundaries.className='boundaries';gallery.append(boundaries);for(const page of [...manifest.boundary,...(manifest.collector?.boundary??[])]){const line=document.createElement('div');line.className='boundary';const shot=document.createElement('a');shot.textContent=page.title;shot.href=imageURL(`boundary/${page.id}.jpg`);shot.target='_blank';const link=document.createElement('a');link.href=`${interactiveRoot}${page.url}`;link.textContent='交互页面';link.dataset.capture=`boundary/${page.id}`;link.dataset.title=page.title;link.dataset.state='boundary';line.append(shot,link);boundaries.append(line)}
const detailHeading=document.createElement('h2');detailHeading.textContent='业务详情';gallery.append(detailHeading);const detailLinks=document.createElement('div');detailLinks.className='boundaries';for(const item of supplemental){const link=document.createElement('a');link.textContent=item.title;link.href=imageURL(item.file);link.target='_blank';link.className='boundary';detailLinks.append(link)}gallery.append(detailLinks);
function update(){const state=stateControl.value;for(const item of cards){const visible=(groupControl.value==='all'||item.page.group===groupControl.value)&&item.card.dataset.search.includes(keyword.value.trim());item.card.classList.toggle('hidden',!visible);const image=imageURL(item.page.states.find(value=>value.state===state).image);if(!image){item.img.removeAttribute('src');item.img.style.display='none';item.pending.style.display='grid';item.thumb.removeAttribute('href');continue}if(!item.img.src.endsWith(image)){item.img.style.display='block';item.pending.style.display='none';item.img.src=image;item.thumb.href=image;item.img.alt=`${item.page.title} · ${stateControl.selectedOptions[0].text}`}}for(const section of gallery.querySelectorAll('section'))section.classList.toggle('hidden',!Array.from(section.querySelectorAll('.card')).some(card=>!card.classList.contains('hidden')))}keyword.addEventListener('input',update);groupControl.addEventListener('change',update);stateControl.addEventListener('change',update);const requestedModule=new URLSearchParams(location.search).get('module');if(galleryGroups.some(group=>group.id===requestedModule)){groupControl.value=requestedModule;update()}
}
startGallery().catch(()=>{const target=document.getElementById('gallery');target.setAttribute('role','alert');target.textContent='图库加载失败，请刷新页面重试。'});
</script></body></html>
